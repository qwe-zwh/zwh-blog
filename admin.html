<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>发布文章 | zwh 的博客</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin-shell">
    <a class="brand" href="/index.html"><span class="brand-mark">z</span><span>zwh 的博客</span></a>
    <section id="loginPanel" class="admin-panel narrow">
      <p class="eyebrow"><span class="status-dot"></span> PRIVATE EDITOR</p>
      <h1>写一篇新的文章</h1>
      <p class="intro-text">输入发布密钥后，即可在此页面直接发布；密钥只保存在当前浏览器会话中。</p>
      <label>发布密钥<input id="tokenInput" type="password" placeholder="输入 Cloudflare 中设置的 ADMIN_TOKEN" autocomplete="current-password"></label>
      <button id="loginButton" class="primary-button" type="button">进入编辑器</button>
      <p id="loginError" class="form-message" role="alert"></p>
    </section>
    <section id="editorPanel" class="admin-panel" hidden>
      <div class="editor-head"><div><p class="eyebrow"><span class="status-dot"></span> DRAFT / ONLINE</p><h1>发布文章</h1></div><button id="logoutButton" class="text-button" type="button">退出</button></div>
      <form id="postForm">
        <label>标题<input id="titleInput" required maxlength="120" placeholder="给文章一个清楚的标题"></label>
        <label>摘要<textarea id="excerptInput" required maxlength="260" rows="3" placeholder="首页会显示这段简短介绍"></textarea></label>
        <label>标签<span class="field-tip">用逗号分隔，例如：技术, 随笔</span><input id="tagsInput" maxlength="180" placeholder="技术, 随笔"></label>
        <label>正文<span class="field-tip">支持纯文本；空行会显示为分段。</span><textarea id="contentInput" required maxlength="20000" rows="16" placeholder="开始写作..."></textarea></label>
        <div class="editor-actions"><button id="publishButton" class="primary-button" type="submit">发布文章</button><a href="/index.html" class="text-button">返回博客</a></div>
        <p id="formMessage" class="form-message" role="status"></p>
      </form>
    </section>
    <section id="managePanel" class="admin-panel manage-panel" hidden>
      <div class="editor-head"><div><p class="eyebrow"><span class="status-dot"></span> PUBLISHED</p><h2>管理文章</h2></div><button id="refreshPosts" class="text-button" type="button">刷新列表</button></div>
      <div id="managedPosts" class="managed-posts"></div>
      <p id="manageMessage" class="form-message" role="status"></p>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
