<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>发布文章 | zwh 的博客</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">
  <main class="admin-shell">
    <header class="admin-topbar">
      <a class="brand" href="/index.html"><span class="brand-mark">z</span><span>zwh 的博客</span></a>
      <button class="icon-button" id="themeToggle" type="button" aria-label="切换深色模式" title="切换深色模式" aria-pressed="false">☾</button>
    </header>
    <section id="loginPanel" class="admin-panel narrow">
      <p class="eyebrow"><span class="status-dot"></span> PRIVATE EDITOR</p>
      <h1>进入后台页面</h1>
      <p class="intro-text">输入后台密钥后，可以发布和管理博客文章；密钥只保存在当前浏览器会话中。</p>
      <label>发布密钥<input id="tokenInput" type="password" placeholder="输入 Cloudflare 中设置的 ADMIN_TOKEN" autocomplete="current-password"></label>
      <button id="loginButton" class="primary-button" type="button">进入编辑器</button>
      <p id="loginError" class="form-message" role="alert"></p>
    </section>
    <section id="editorPanel" class="admin-panel" hidden>
      <div class="editor-head"><div><p class="eyebrow"><span class="status-dot"></span> <span id="editorModeLabel">DRAFT / ONLINE</span></p><h1 id="editorTitle">发布文章</h1></div><button id="logoutButton" class="text-button" type="button">退出</button></div>
      <form id="postForm">
        <label>标题<input id="titleInput" required maxlength="120" placeholder="给文章一个清楚的标题"></label>
        <label>摘要<textarea id="excerptInput" required maxlength="260" rows="3" placeholder="首页会显示这段简短介绍"></textarea></label>
        <label>标签<span class="field-tip">用逗号分隔，例如：技术, 随笔</span><input id="tagsInput" maxlength="180" placeholder="技术, 随笔"></label>
        <fieldset class="media-editor">
          <legend>文章图片</legend>
          <p class="field-tip">支持 JPEG、PNG、WebP、GIF，单张不超过 5 MB。也可以把光标放进正文，直接按 Ctrl + V 粘贴截图。</p>
          <label class="media-file-label">选择图片<input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label>
          <label>图片说明（可选）<input id="imageAltInput" maxlength="120" placeholder="例如：项目首页截图"></label>
          <div class="media-actions">
            <button id="uploadCoverButton" class="access-button" type="button">上传为封面</button>
            <button id="insertImageButton" class="access-button" type="button">上传并插入正文</button>
          </div>
          <div id="coverPreview" class="cover-preview" hidden>
            <img id="coverPreviewImage" alt="当前文章封面预览">
            <div><p>当前封面</p><button id="removeCoverButton" class="delete-button" type="button">移除封面</button></div>
          </div>
          <p id="mediaMessage" class="form-message" role="status"></p>
        </fieldset>
        <label>正文<span class="field-tip">空行分段；用 ```js 和 ``` 包住代码；按 Ctrl + V 可在光标处上传并插入截图。</span><textarea id="contentInput" required maxlength="20000" rows="16" placeholder="开始写作，或直接粘贴截图..."></textarea></label>
        <label class="password-option"><input id="protectPostInput" type="checkbox"> 阅读文章需要密码</label>
        <p id="editProtectionNote" class="edit-protection-note" hidden></p>
        <label id="readPasswordField" hidden>阅读密码<span class="field-tip">该密码不能找回，请妥善保存。</span><input id="readPasswordInput" type="password" maxlength="128" autocomplete="new-password" placeholder="设置读者查看正文时需要输入的密码"></label>
        <div class="editor-actions"><button id="publishButton" class="primary-button" type="submit">发布文章</button><button id="cancelEditButton" class="text-button" type="button" hidden>取消编辑</button><a href="/index.html" class="text-button">返回博客</a></div>
        <p id="formMessage" class="form-message" role="status"></p>
      </form>
    </section>
    <section id="managePanel" class="admin-panel manage-panel" hidden>
      <div class="editor-head"><div><p class="eyebrow"><span class="status-dot"></span> PUBLISHED</p><h2>管理文章</h2></div><button id="refreshPosts" class="text-button" type="button">刷新列表</button></div>
      <div id="managedPosts" class="managed-posts"></div>
      <p id="manageMessage" class="form-message" role="status"></p>
    </section>

    <section id="commentManagePanel" class="admin-panel manage-panel" hidden>
      <div class="editor-head"><div><p class="eyebrow"><span class="status-dot"></span> COMMENTS</p><h2>管理评论</h2></div><button id="refreshComments" class="text-button" type="button">刷新评论</button></div>
      <div id="managedComments" class="managed-comments"></div>
      <p id="commentManageMessage" class="form-message" role="status"></p>
    </section>

    <dialog id="passwordDialog" class="password-dialog" aria-labelledby="passwordDialogTitle">
      <form id="passwordForm">
        <div class="dialog-head">
          <div>
            <p class="eyebrow"><span class="status-dot"></span> ARTICLE ACCESS</p>
            <h2 id="passwordDialogTitle">设置阅读密码</h2>
          </div>
          <button id="closePasswordDialog" class="dialog-close" type="button" aria-label="关闭">×</button>
        </div>
        <p id="passwordDialogPost" class="dialog-post"></p>
        <label>新密码<input id="managedPasswordInput" type="password" maxlength="128" autocomplete="new-password" required placeholder="输入读者访问正文时使用的密码"></label>
        <label>确认密码<input id="managedPasswordConfirm" type="password" maxlength="128" autocomplete="new-password" required placeholder="再次输入密码"></label>
        <div class="editor-actions">
          <button id="savePasswordButton" class="primary-button" type="submit">保存密码</button>
          <button id="cancelPasswordButton" class="text-button" type="button">取消</button>
        </div>
        <p id="passwordDialogMessage" class="form-message" role="alert"></p>
      </form>
    </dialog>
  </main>
  <script src="admin.js"></script>
</body>
</html>
